plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.luna.prsauto'
    compileSdk 34

    defaultConfig {
        applicationId 'com.luna.prsauto'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
        debug {
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    // Tanpa dependensi eksternal: semua API yang dipakai (Accessibility,
    // MediaProjection, MediaStore, Notification) tersedia di framework.
}
